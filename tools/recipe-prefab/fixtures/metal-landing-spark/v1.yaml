id: metal-landing-spark
category: recipe
engine: unity
license: cc0
intent: [impact, landing, metal-on-metal]
style: [cartoon, mobile, puzzle]
description: >
  Metal-on-metal landing spark for a nut or piece seating on a rod. A fixed 12 particle pool is fired as
  one Emit(EmitParams, 1) per spark with an upward-hemisphere velocity, so the system has no emission,
  shape or start speed of its own. Stretched additive streaks, white-hot fading to orange.
build:
  particle_system:
    main:
      play_on_awake: false
      loop: false
      start_lifetime: 0.22 -> 0.28
      start_speed: 0   # velocity comes from EmitParams
      start_size: 0.32 -> 0.48
      gravity_modifier: 0.6
      simulation_space: world
      scaling_mode: hierarchy
      max_particles: 12
    emission: disabled
    shape: disabled
    color_over_lifetime:
      color: [white-hot (0.85,0.85,0.78) at 0.0, orange (0.85,0.45,0.10) at 0.85 and 1.0]
      alpha: [1 at 0.0, 1 at 0.60, 0 at 1.0]
    renderer:
      render_mode: stretch
      velocity_scale: 0.12
      length_scale: 1.5
      sort_mode: none
      material: unlit additive, texture vfx://texture/kenney-spark-01/1 (64 px, no mips, sRGB)
emit_pattern:
  count: 12 fixed, independent of stack height
  speed_m_per_s: 2.0 -> 3.5   # linear over the landing ladder (light landing -> heavy landing)
  direction: unit vector in the upper hemisphere, elevation y >= 0.35, hashed from a per-landing seed (no random state)
  origin: the seat of the landed piece; board-local offsets (rim height, back-plane shift) MUST be multiplied by the board fit scale, the base point is already world space
notes:
  - Per-channel colour cap 0.85 so the additive streak never clips to pure white over a bright face
  - Spawn the spark behind the piece face on a back plane so it reads as sparking at the seat, not floating in front
  - Gotcha: adding board-local offsets to a world point without the board root scale (0.61 on a ten-bolt board) puts the spark about 0.67 units above the rim
  - Keep lifetime under 0.3 s; longer turns streaks into slow floating dots
